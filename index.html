<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noimageindex">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#ecdfc6">
  <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%icons/ghost-180.png">
  <link rel="icon" href="data:,">
  <!-- The game's typeface, fetched at once so the first words are not set twice (src/ui/ui.css). -->
  <link rel="preload" href="%BASE_URL%fonts/andika-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="%BASE_URL%fonts/andika-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="%BASE_URL%fonts/playpen-sans-700-sv.woff2" as="font" type="font/woff2" crossorigin>
  <title>Elof och det stora godisäventyret</title>
  <!-- The loading card is inline, so it shows before any script has arrived. No external requests. -->
  <style>
    html, body { position: fixed; inset: 0; margin: 0; overflow: hidden; background: #ecdfc6; }
    .loading {
      position: absolute; inset: 0; z-index: 10; display: grid; place-items: center;
      background: #ecdfc6; transition: opacity 0.4s ease;
    }
    .loading.done { opacity: 0; pointer-events: none; }
    .loading svg { height: min(34vh, 34vw, 210px); width: auto; animation: bob 2.4s ease-in-out infinite; }
    @keyframes bob {
      0%, 100% { transform: translateY(0) rotate(-2deg); }
      50% { transform: translateY(-6px) rotate(2deg); }
    }
    @media (prefers-reduced-motion: reduce) { .loading svg { animation: none; } }
    /* Going on from a chapter's last page, the card is the next chapter's time card: black, with its scrap of Moa's
       paper where the chapter's own card has it, so the picture fades up from it (docs/ux-audit/first-minutes.md
       row 2). The words come from the page before, through this tab's session (src/save/onward.ts). */
    @font-face { font-family: 'Playpen Sans'; font-weight: 700; font-display: swap; src: url('%BASE_URL%fonts/playpen-sans-700-sv.woff2') format('woff2'); }
    .loading.onward { background: #0b0806; }
    .loading.onward svg, .loading-card { display: none; }
    .loading.onward .loading-card {
      position: absolute; left: 50%; bottom: max(12vh, 72px); display: grid; justify-items: center;
      min-width: min(60vw, 320px); margin: 0; padding: 14px 34px 16px; transform: translateX(-50%) rotate(-1.5deg);
      background: #fbf4e4; color: #33241a; font: 700 34px/1.15 'Playpen Sans', 'Andika', sans-serif; white-space: nowrap;
      clip-path: polygon(0 4%, 3% 0, 97% 2%, 100% 0, 98% 18%, 100% 34%, 97% 52%, 100% 70%, 98% 86%, 100% 100%, 3% 98%,
        0 100%, 2% 82%, 0 64%, 3% 46%, 0 28%, 2% 14%);
    }
    .loading-card small { margin-top: 4px; font-size: 20px; color: #6b4a2c; }
    @media (orientation: portrait) { .loading.onward .loading-card { top: 26%; bottom: auto; } }
  </style>
</head>
<body>
  <canvas id="game"></canvas>

  <div class="loading" id="loading">
    <svg viewBox="0 0 120 150" aria-hidden="true">
      <g>
        <rect x="44" y="118" width="11" height="3" fill="#3b7dd8"/><rect x="44" y="121" width="11" height="3" fill="#3fa34d"/>
        <rect x="44" y="124" width="11" height="3" fill="#f2c230"/><rect x="44" y="127" width="11" height="3" fill="#d8402f"/>
        <rect x="44" y="130" width="11" height="3" fill="#f08a24"/>
        <rect x="65" y="118" width="11" height="3" fill="#3b7dd8"/><rect x="65" y="121" width="11" height="3" fill="#3fa34d"/>
        <rect x="65" y="124" width="11" height="3" fill="#f2c230"/><rect x="65" y="127" width="11" height="3" fill="#d8402f"/>
        <rect x="65" y="130" width="11" height="3" fill="#f08a24"/>
      </g>
      <path d="M41 133 h16 v5 q0 4 -4 4 h-14 q-4 0 -4 -3 q0 -6 6 -6 z" fill="#c8312a"/>
      <path d="M35 139 q0 -3 4 -3 h4 v6 h-4 q-4 0 -4 -3 z" fill="#ffffff"/>
      <path d="M63 133 h16 v5 q0 4 -4 4 h-14 q-4 0 -4 -3 q0 -6 6 -6 z" fill="#c8312a"/>
      <path d="M57 139 q0 -3 4 -3 h4 v6 h-4 q-4 0 -4 -3 z" fill="#ffffff"/>
      <path d="M60 8 C36 8 25 30 25 56 L23 116 L34 121 L44 116 L54 122 L64 116 L75 122 L86 116 L97 120 L95 56 C95 30 84 8 60 8 Z"
            fill="#ead2a6" stroke="#b98e5c" stroke-width="2" stroke-linejoin="round"/>
      <path d="M60 8 L52 40 L38 64 M60 8 L70 38 L86 60 M52 40 L70 38 M38 64 L44 116 M86 60 L86 116"
            fill="none" stroke="#b98e5c" stroke-width="1" opacity="0.55"/>
      <circle cx="48" cy="50" r="6" fill="#141414"/><circle cx="72" cy="50" r="6" fill="#141414"/>
      <circle cx="50" cy="48" r="1.8" fill="#ffffff"/><circle cx="74" cy="48" r="1.8" fill="#ffffff"/>
      <path d="M52 76 L80 74 L82 104 L54 106 Z" fill="#d9b98a" stroke="#b98e5c" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="M52 76 L80 74 L78 81 L53 83 Z" fill="#c9a571"/>
      <circle cx="60" cy="90" r="2.2" fill="#d8402f"/><circle cx="70" cy="88" r="2.2" fill="#3fa34d"/>
      <circle cx="65" cy="98" r="2.2" fill="#f08a24"/><circle cx="74" cy="99" r="2" fill="#d8402f"/>
      <!-- its two carved fists, holding the bag -->
      <ellipse cx="51" cy="86" rx="6" ry="5" fill="#ead2a6" stroke="#b98e5c" stroke-width="1.5"/>
      <ellipse cx="83" cy="84" rx="6" ry="5" fill="#ead2a6" stroke="#b98e5c" stroke-width="1.5"/>
    </svg>
  </div>

  <script>
    // The next chapter's time card on the loading card, when this page goes on from the one before.
    try {
      var card = sessionStorage.getItem('godisbus.v1.onward-card');
      if (card) {
        var words = card.split(' · ');
        var scrap = document.createElement('p');
        scrap.className = 'loading-card';
        scrap.textContent = words[0];
        if (words[1]) { var time = document.createElement('small'); time.textContent = words[1]; scrap.append(time); }
        var loading = document.getElementById('loading');
        loading.append(scrap);
        loading.classList.add('onward');
      }
    } catch (e) { /* Without session storage the card is the ordinary one. */ }
  </script>
  <noscript>Elof och det stora godisäventyret behöver JavaScript.</noscript>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
