# Builds the game and publishes it to GitHub Pages on every push to main (docs/game-plan.md §6.11).
# The same checks run on pull requests in ci.yml.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # The words the privacy check looks for. Without the secret it runs its built-in rules only.
      PRIVACY_DENYLIST: ${{ secrets.PRIVACY_DENYLIST }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # exiftool reads the metadata of pictures, models and sound. Without it the check uses its own scan.
      - name: Install exiftool
        continue-on-error: true
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libimage-exiftool-perl
      # The asset build turns textures into KTX2 with this tool (plan §5.6).
      - run: bash ./scripts/install-ktx.sh
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run privacy-check
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
