# Builds the game and publishes it to GitHub Pages on every push to main (docs/game-plan.md §6.11).
# The same checks run on pull requests in ci.yml.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # The words the privacy check looks for. Without the secret it runs its built-in rules only.
      PRIVACY_DENYLIST: ${{ secrets.PRIVACY_DENYLIST }}
      # Whether the family's models can be fetched. A secret can't be read in `if:`; this can.
      HAS_FAMILY: ${{ secrets.FAMILY_ASSETS_KEY != '' }}
    steps:
      - uses: actions/checkout@v7
      # The family's models (plan §2.6, §6.11) live in a private repository, so that they can always be taken
      # down: delete the secret FAMILY_ASSETS_KEY, or the files there, and run this workflow again. They are
      # fetched with a read-only deploy key into art/private, where the asset build looks for them. Without
      # the secret the site shows the stand-in figures. Pull requests never get them (ci.yml).
      - name: Fetch the family's models
        if: env.HAS_FAMILY == 'true'
        uses: actions/checkout@v7
        with:
          repository: olovmelander/spokets-godisbus-familj
          ssh-key: ${{ secrets.FAMILY_ASSETS_KEY }}
          path: art/private
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # exiftool reads the metadata of pictures, models and sound. Without it the check uses its own scan.
      - name: Install exiftool
        continue-on-error: true
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libimage-exiftool-perl
      # The asset build turns textures into KTX2 with this tool (plan §5.6).
      - run: bash ./scripts/install-ktx.sh
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # If the models were fetched, they must be in the site: a deploy never falls back to stand-ins in silence.
      - name: Check that the family's models were packed
        if: env.HAS_FAMILY == 'true'
        run: test -s dist/packs/private/elof.glb && test -s dist/packs/private/ghost.glb
      - run: npm run privacy-check
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
